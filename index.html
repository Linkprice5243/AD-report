<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 데이터 리뷰</title><style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#19283d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5eaf1;padding:22px max(22px,calc((100vw - 1240px)/2))}header h1{font-size:24px;margin:0 0 6px}small,.muted{color:#7b8798}main{max-width:1240px;margin:auto;padding:28px 22px}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}.nav button,.tabs button{border:1px solid #dce4ee;background:#fff;padding:12px 17px;border-radius:10px;font-weight:700;color:#45546b;cursor:pointer}.nav button.active,.tabs button.active{background:#2149d8;color:white;border-color:#2149d8}.panel{background:white;border:1px solid #e6ebf2;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px #1c356008}.panel h2{margin:0 0 7px;font-size:20px}.panel h3{font-size:16px;margin:0 0 15px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.metric{background:#f7f9fd;border:1px solid #e8edf6;border-radius:12px;padding:16px}.metric span{display:block;color:#728099;font-size:12px}.metric b{display:block;font-size:22px;margin-top:9px;overflow-wrap:anywhere}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.scroll{overflow:auto;max-height:600px}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:right;border-bottom:1px solid #e9edf3;padding:11px 12px}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f3f6fc;color:#5d6c83}tr:hover td{background:#f8faff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}input{border:1px solid #dbe3ee;border-radius:9px;padding:11px;width:250px;max-width:100%}.hint{font-size:12px;color:#8190a2;line-height:1.6}.bar{height:9px;background:#e8edf7;border-radius:6px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:#456de2}.chartrow{display:grid;grid-template-columns:85px 1fr 105px;gap:12px;align-items:center;margin:12px 0;font-size:13px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric b{font-size:17px}.panel{padding:15px}header{padding:20px}}
.campaign-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.campaign-card{border:1px solid #e4eaf3;border-radius:14px;padding:18px;background:#fbfcff}.campaign-name{font-size:15px;font-weight:750;line-height:1.5;overflow-wrap:anywhere;margin-bottom:16px}.campaign-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.campaign-kpis span{display:block;color:#78869a;font-size:12px;margin-bottom:6px}.campaign-kpis b{font-size:17px;overflow-wrap:anywhere}.campaign-kpis .roas{color:#2149d8}.campaign-bottom{border-top:1px solid #e9edf3;margin-top:15px;padding-top:12px;display:flex;gap:16px;flex-wrap:wrap;color:#758297;font-size:12px}.campaign-bottom strong{color:#293b56}@media(max-width:850px){.campaign-grid{grid-template-columns:1fr}}@media(max-width:480px){.campaign-kpis{grid-template-columns:1fr 1fr}.campaign-kpis b{font-size:15px}}</style></head><body><header><h1>광고 데이터 리뷰</h1><small>계정별 · 매체별 성과 데이터 | 업로드된 엑셀 기준</small></header><main><nav class="nav" id="nav"></nav><section id="app"></section></main><script src="data.js"></script><script>
const keys=[['zib_naver','지빌리언즈 · 네이버'],['zib_coupang','지빌리언즈 · 쿠팡'],['dodam_naver','도담 · 네이버'],['dodam_coupang','도담 · 쿠팡']];let current=location.hash.slice(1);if(!window.REVIEW_DATA)document.getElementById('app').textContent='data.js 파일을 함께 업로드해주세요.';if(!keys.some(x=>x[0]===current))current='zib_naver';let tab='';const fmt=n=>typeof n==='number'?Math.round(n).toLocaleString('ko-KR'):String(n??'-');const money=n=>fmt(n)+'원';const pct=n=>(Number(n)*100).toFixed(1)+'%';const row=(sheet,num)=>sheet.find(x=>x.r===num)?.v||{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const metric=(name,val)=>`<div class="metric"><span>${esc(name)}</span><b>${esc(val)}</b></div>`;
function render(){const [key,label]=keys.find(x=>x[0]===current),item=REVIEW_DATA[key];document.getElementById('nav').innerHTML=keys.map(([k,v])=>`<button class="${k===current?'active':''}" onclick="switchKey('${k}')">${v}</button>`).join('');const s=item.sheets;let out=`<div class="panel"><h2>${label}</h2><div class="hint">원본: ${esc(item.file)} · 데이터는 원본 엑셀에 저장된 값 기준이며 실시간 연동되지 않습니다.</div>`;
if(key.endsWith('coupang')){const monthly=s['성과 요약'].filter(x=>x.r>=17&&x.r<=19).map(x=>x.v).filter(x=>String(x.D).includes('26년'));const latest=monthly[monthly.length-1]||{};out+=`<div class="metrics">${metric('광고비 · '+latest.E,money(latest.I))}${metric('광고 전환매출',money(latest.N))}${metric('ROAS',pct(latest.O))}${metric('주문수 (14일)',fmt(latest.K))}</div></div>`;out+=`<div class="panel"><h3>월별 광고 성과</h3>${table(['월','노출','클릭','CTR','광고비','CPC','주문수','CVR','전환매출','ROAS','전체매출'],monthly.map(r=>[r.D+' '+r.E,fmt(r.F),fmt(r.G),pct(r.H),money(r.I),money(r.J),fmt(r.K),pct(r.M),money(r.N),pct(r.O),money(r.Q)]))}<p class="hint">쿠팡 전환/매출은 원본의 14일 기여 기준입니다. 월별 집계값을 임의로 재계산하지 않았습니다.</p></div>`;out+=`<div class="panel"><h3>월별 광고비 · 전환매출 비교</h3>${bars(monthly.map(r=>({name:r.E,spend:r.I,sales:r.N})))}</div>`;out+=campaignCards(item.campaigns||[]);
}else{let r=row(s['새로고침'],6),lines=[row(s['새로고침'],4),row(s['새로고침'],5)];out+=`<div class="metrics">${metric('SA 광고비',money(r.D))}${metric('SA 전환매출',money(r.F))}${metric('SA ROAS',r.D?pct(r.F/r.D):'-')}${metric('SA 전환수',fmt(r.E))}</div></div>`;out+=`<div class="panel"><h3>네이버 SA · 캠페인 유형별</h3>${table(['유형','노출','클릭','광고비','전환','전환매출','ROAS'],lines.map(v=>[v.A,fmt(v.B),fmt(v.C),money(v.D),fmt(v.E),money(v.F),v.D?pct(v.F/v.D):'-']))}</div>`;const daily=['AD부스트 일자데이터','NDA (리타겟팅) 일자데이터'].filter(k=>s[k]);for(const name of daily){const records=s[name].filter(x=>x.r>7&&typeof x.v.C==='number'&&typeof x.v.B==='string'&&x.v.B.includes('2026'));const sum=(col)=>records.reduce((a,r)=>a+(Number(r.v[col])||0),0);out+=`<div class="panel"><h3>${name.replace(' 일자데이터','')} · 일자별</h3><div class="metrics">${metric('광고비',money(sum('C')))}${metric('구매완료 매출',money(sum('J')))}${metric('구매완료 ROAS',sum('C')?pct(sum('J')/sum('C')):'-')}${metric('구매완료',fmt(sum('H')))}</div>${table(['캠페인','일자','광고비','노출','클릭','구매완료','구매매출','구매 ROAS'],records.map(x=>{const v=x.v;return[v.A,v.B,money(v.C),fmt(v.D),fmt(v.E),fmt(v.H),money(v.J),v.C?pct(v.J/v.C):'-']}))}</div>`}}
const available=Object.keys(s).filter(k=>!['새로고침','SA 요약','성과 요약','AD부스트 일자데이터','NDA (리타겟팅) 일자데이터','키워드','캠페인별 성과'].includes(k));if(!available.includes(tab))tab=available[0];if(available.length)out+=`<div class="panel"><h3>상세 데이터</h3><div class="tabs">${available.map(k=>`<button class="${tab===k?'active':''}" onclick="setTab('${k.replace(/'/g,"\\'")}')">${esc(k)}</button>`).join('')}</div><div class="toolbar"><span class="hint">원본 시트 데이터 (일부 미리보기) · 숫자/텍스트 검색</span><input id="search" placeholder="데이터 검색" oninput="filterTable()"></div><div id="detail"></div><p class="hint">복잡한 원본 피벗/수식 시트는 원본의 저장된 셀 값을 표 형태로 표시합니다. 일부 상세 시트는 최대 350행까지 포함됩니다.</p></div>`;document.getElementById('app').innerHTML=out;if(available.length)renderDetail()}

function campaignCards(items){if(!items.length)return '<div class="panel"><h3>캠페인별 성과</h3><p class="hint">표시할 캠페인 데이터가 없습니다.</p></div>';return `<div class="panel"><div class="toolbar"><div><h3>캠페인별 성과 요약</h3><p class="hint">원본 캠페인 시트의 표시된 주차 합계 · 광고비 순 정렬 · 14일 기여 전환 기준</p></div></div><div class="campaign-grid">${[...items].sort((a,b)=>b.spend-a.spend).map(c=>`<article class="campaign-card"><div class="campaign-name">${esc(c.name)}</div><div class="campaign-kpis"><div><span>광고비</span><b>${money(c.spend)}</b></div><div><span>전환매출</span><b>${money(c.sales)}</b></div><div><span>ROAS</span><b class="roas">${c.spend?pct(c.sales/c.spend):'-'}</b></div></div><div class="campaign-bottom"><span>클릭 <strong>${fmt(c.clicks)}</strong></span><span>주문 <strong>${fmt(c.orders)}</strong></span><span>주차 <strong>${c.weeks.length}개</strong></span></div></article>`).join('')}</div></div>`}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bars(rows){const max=Math.max(1,...rows.flatMap(r=>[r.spend,r.sales]));return rows.map(r=>`<div class="chartrow"><b>${esc(r.name)} 광고비</b><div class="bar"><i style="width:${100*r.spend/max}%"></i></div><span>${fmt(r.spend)}원</span></div><div class="chartrow"><b>${esc(r.name)} 매출</b><div class="bar"><i style="width:${100*r.sales/max}%;background:#23a98d"></i></div><span>${fmt(r.sales)}원</span></div>`).join('')}
function renderDetail(){const records=REVIEW_DATA[current].sheets[tab]||[];const cols=[...new Set(records.flatMap(x=>Object.keys(x.v)))].sort((a,b)=>colnum(a)-colnum(b));const rows=records.map(x=>[x.r,...cols.map(c=>x.v[c]??'')]);document.getElementById('detail').innerHTML=table(['행',...cols],rows)}function colnum(s){return [...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)}function filterTable(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#detail tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}function setTab(k){tab=k;render()}function switchKey(k){current=k;tab='';location.hash=k;render()}render();
</script></body></html>
